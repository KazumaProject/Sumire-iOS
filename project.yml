name: Sumire
options:
  bundleIdPrefix: com.kazumaproject.sumire
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: 'c++20'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  SumireCore:
    path: Core
targets:
  Sumire:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ConversionCore/src
        excludes: [main.cpp]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [SumireLogo]
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [SumireLogo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazumaproject.sumire.ios
        CODE_SIGN_ENTITLEMENTS: Shared/Sumire.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Shared/ConversionBridge.h
        OTHER_LDFLAGS: ['$(inherited)', '-lz', '-lc++', '-framework', 'CoreFoundation']
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sumire
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: SumireCore
      - target: SumireKeyboard
        embed: true
  SumireKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: ConversionCore/src
        excludes: [main.cpp]
      - path: ../sumire-data/cli-english-v1
        type: folder
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Sumire
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazumaproject.sumire.ios.keyboard
        CODE_SIGN_ENTITLEMENTS: Shared/Sumire.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Shared/ConversionBridge.h
        OTHER_LDFLAGS: ['$(inherited)', '-lz', '-lc++', '-framework', 'CoreFoundation']
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: SumireCore
  SumireNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NativeTests
      - Shared/ConversionService.swift
      - Shared/KeyboardSettings.swift
      - Shared/PersonalDataLocation.swift
      - Shared/DocumentProxyIdentity.swift
      - Shared/CandidateBar.swift
      - Shared/KeyboardPalette.swift
      - Shared/KeyboardIcon.swift
      - path: ConversionCore/src
        excludes: [main.cpp]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kazumaproject.sumire.ios.nativetests
        SWIFT_OBJC_BRIDGING_HEADER: Shared/ConversionBridge.h
        OTHER_LDFLAGS: ['$(inherited)', '-lz', '-lc++', '-framework', 'CoreFoundation']
    dependencies:
      - target: Sumire
      - package: SumireCore
  SumireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kazumaproject.sumire.ios.uitests
    dependencies:
      - target: Sumire
schemes:
  Sumire:
    build:
      targets:
        Sumire: all
    test:
      targets:
        - SumireUITests
  SumireCoreBenchmark:
    build:
      targets:
        Sumire: all
        SumireNativeTests: [test]
    test:
      config: Release
      targets:
        - SumireNativeTests
